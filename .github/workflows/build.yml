name: Build and publish CloudStream repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.4"

      - name: Build plugin and repository JSON
        run: gradle --no-daemon --stacktrace make makePluginsJson

      - name: Stage plugin files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cloudstream-publish
          find . -type f -path "*/build/*.cs3" -exec cp {} /tmp/cloudstream-publish/ \;
          cp build/plugins.json /tmp/cloudstream-publish/plugins.json
          test -s /tmp/cloudstream-publish/plugins.json
          ls -lah /tmp/cloudstream-publish

      - name: Publish repository branch
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf . || true
          cp -R /tmp/cloudstream-publish/. .
          git add .
          git commit -m "Publish CloudStream plugins for $GITHUB_SHA"
          git push origin builds --force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugin
          path: /tmp/cloudstream-publish/*
          if-no-files-found: error
